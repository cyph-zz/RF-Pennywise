[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
lib_deps =
    olikraus/U8g2@^2.36.18
    nrf24/RF24@^1.6.1
    adafruit/Adafruit NeoPixel@^1.15.5
